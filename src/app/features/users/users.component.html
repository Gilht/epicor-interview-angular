<div class="container">
  <div class="header">
    <h2>Users Panel</h2>
    <div class="actions">
      <button class="btn btn-primary" (click)="createUser()">Create User</button>
    </div>
  </div>

  <div class="container">
    <app-users-list
      [users]="users()"
      (edit)="editUser($event)"
      (delete)="openDeleteDialog($event)"
    ></app-users-list>
  </div>

  @if (showDeleteDialog) {
  <app-dialog title="Delete user" message="Are you sure you want to delete this user?" confirmText="Delete"
    cancelText="Cancel" (confirmed)="confirmDelete()" (cancelled)="closeDeleteDialog()"></app-dialog>
  }

</div>
